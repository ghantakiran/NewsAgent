# ── Primary catalyst sources ──────────────────────────────────────────
# These are where catalysts break first: the filing itself, the company's own
# press release, the regulator, and the halt tape. Everything else is a retelling.

[[feeds]]
name = "SEC 8-K Filings"
url = "https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent&type=8-K&company=&dateb=&owner=include&count=100&output=atom"
category = "filing"
enabled = true

[[feeds]]
name = "SEC Offerings (424B5)"
url = "https://www.sec.gov/cgi-bin/browse-edgar?action=getcurrent&type=424B5&company=&dateb=&owner=include&count=40&output=atom"
category = "filing"
enabled = true

[[feeds]]
name = "Nasdaq Trading Halts"
url = "http://www.nasdaqtrader.com/rss.aspx?feed=tradehalts"
category = "filing"
enabled = true

# GlobeNewswire throttles repeat pollers to a hard timeout — left off by default
# because a dead feed costs a slot in every refresh cycle. Business Wire and PR
# Newswire cover the same releases. Flip to true if it starts answering again.
[[feeds]]
name = "GlobeNewswire Public Companies"
url = "https://www.globenewswire.com/RssFeed/orgclass/1/feedTitle/GlobeNewswire%20-%20News%20about%20Public%20Companies"
