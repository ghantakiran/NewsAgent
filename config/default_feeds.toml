# ── Fast aggregation & press releases ─────────────────────────────────
# StockTitan carries company press releases as they cross the wire and puts the
# ticker in the headline. Finviz has no RSS, so it is parsed from HTML — its
# news table links straight to the original publisher, which is why a story it
# surfaces scores as Reuters or WSJ rather than as Finviz.

[[feeds]]
