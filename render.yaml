services:
  - type: web
    name: newsagent-api
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: newsagent-db
          property: connectionURI
      - key: PYTHON_VERSION
        value: "3.12"

databases:
  - name: newsagent-db
    plan: free
    databaseName: newsagent
